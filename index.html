<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KimFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="titlebar"></div>
      <main id="main">
        <div id="recording-area">
          <div id="status-row">
            <span id="status-dot"></span>
            <span id="status-text">Ready</span>
            <span id="status-error" class="hidden"></span>
          </div>
          <button id="record-btn" aria-label="Start Recording">
            <svg id="record-icon-mic" width="28" height="28" viewBox="0 0 24 24" fill="none">
              <rect x="8" y="1" width="8" height="14" rx="4" stroke="currentColor" stroke-width="1.8" fill="currentColor" fill-opacity="0.2"/>
              <path d="M20 10v1a8 8 0 01-16 0v-1M12 19v3M8 22h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <svg id="record-icon-stop" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="display:none">
              <rect x="4" y="4" width="16" height="16" rx="3"/>
            </svg>
          </button>
          <div id="hotkey-hint">
            Shortcut: <kbd id="hotkey-display">Ctrl+Shift+Space</kbd>
          </div>
        </div>

        <div id="transcript-area" class="hidden">
          <div id="transcript-header">
            <span id="transcript-label">Transcription</span>
            <button id="copy-btn" class="text-btn">Copy</button>
          </div>
          <div id="transcript-text"></div>
        </div>

        <div id="settings-area">
          <details id="settings-details" open>
            <summary id="settings-summary">Settings</summary>
            <div id="settings-grid">

              <div class="s-row" id="engine-row">
                <span class="s-label">Engine</span>
                <div class="toggle-group" id="engine-group">
                  <button class="toggle-btn active" data-value="local">Local</button>
                  <button class="toggle-btn" data-value="groq">Groq</button>
                  <button class="toggle-btn" data-value="deepgram">Deepgram</button>
                </div>
              </div>

              <div class="s-row" id="mic-row">
                <span class="s-label">Microphone</span>
                <select id="mic-select"></select>
              </div>

              <div class="s-row" id="local-row">
                <span class="s-label">Model</span>
                <div class="model-row">
                  <select id="model-select">
                    <option value="small">Small (~466 MB)</option>
                    <option value="medium">Medium (~1.5 GB)</option>
                  </select>
                  <button id="download-btn" class="btn-primary">Download</button>
                </div>
              </div>

              <div id="download-progress" class="hidden">
                <div id="progress-bar"><div id="progress-fill"></div></div>
              </div>

              <div class="s-row" id="groq-row">
                <span class="s-label">Groq API Key</span>
                <input type="password" id="groq-key" placeholder="gsk_..." />
              </div>

              <div class="s-row" id="deepgram-row">
                <span class="s-label">Deepgram API Key</span>
                <input type="password" id="deepgram-key" placeholder="key-..." />
              </div>

              <div class="s-row" id="mode-row">
                <span class="s-label">Mode</span>
                <div class="toggle-group" id="mode-group">
                  <button class="toggle-btn active" data-mode="toggle">Toggle</button>
                  <button class="toggle-btn" data-mode="push-to-talk">Push-to-Talk</button>
                </div>
              </div>

              <div class="s-row" id="accent-row">
                <span class="s-label">Accent color</span>
                <input type="color" id="accent-color" value="#6875f5" aria-label="Choose accent color" />
              </div>

              <div class="s-row" id="hotkey-row">
                <span class="s-label">Capture hotkey</span>
                <div class="hotkey-editor">
                  <input id="hotkey-input" type="text" value="Ctrl+Shift+Space" aria-label="Capture hotkey" placeholder="Ctrl+Shift+Space" />
                  <button id="hotkey-record" class="text-btn" type="button">Record</button>
                </div>
                <kbd id="hotkey-text"></kbd>
              </div>

            </div>
          </details>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
