<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KimFlow</title>
    <style>
      :root { --accent: #6875f5; --accent-glow: rgba(104, 117, 245, 0.35); }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        color: #ececf1;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      .widget {
        width: 100%; height: 100%; padding: 4px 8px 4px 5px;
        display: flex; align-items: center; gap: 7px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        background: rgba(18, 18, 22, 0.92);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .drag-handle {
        -webkit-app-region: drag;
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex; align-items: center; gap: 7px;
        cursor: grab;
      }
      .drag-handle:active { cursor: grabbing; }
      .mic {
        position: relative;
        width: 26px; height: 26px; flex: 0 0 26px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 50%;
        background: #2b2b33;
        color: #a4a4b0;
        transition: background .2s ease, color .2s ease, box-shadow .2s ease, transform .15s ease;
      }
      .mic svg { width: 13px; height: 13px; fill: currentColor; z-index: 1; }
      .waves, .waves::before, .waves::after {
        position: absolute; inset: -3px;
        border: 1px solid transparent; border-radius: 50%;
      }
      .waves::before, .waves::after { content: ''; opacity: 0; }
      .mic.recording {
        color: #fff; background: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }
      .mic.recording .waves, .mic.recording .waves::before, .mic.recording .waves::after {
        border-color: var(--accent); animation: wave-ring 1.6s ease-out infinite;
      }
      .mic.recording .waves::before { animation-delay: .55s; }
      .mic.recording .waves::after { animation-delay: 1.1s; }
      .mic.paused, .mic.transcribing { color: #f5a623; background: rgba(245, 166, 35, 0.16); }
      .state { overflow: hidden; }
      .state-text { color: #c7c7d0; font-size: 11px; font-weight: 500; letter-spacing: .02em; white-space: nowrap; }
      .controls {
        -webkit-app-region: no-drag;
        display: flex; align-items: center; gap: 4px;
      }
      .control {
        width: 22px; height: 22px; padding: 0;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid rgba(255, 255, 255, .1); border-radius: 50%;
        background: #2b2b33; color: #d7d7df; cursor: pointer;
        transition: transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
      }
      .control:hover { color: #fff; background: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
      .control.cancel:hover { background: #f43f5e; border-color: #f43f5e; }
      .control:disabled { opacity: .35; cursor: default; transform: none; }
      .hidden { display: none !important; }
      @keyframes wave-ring {
        0% { transform: scale(.75); opacity: .9; }
        100% { transform: scale(1.6); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <section class="widget" aria-label="KimFlow floating controls">
      <div class="drag-handle" title="Drag to move KimFlow">
        <div class="mic" id="mic" aria-label="Microphone status">
          <span class="waves" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </div>
        <div class="state"><span class="state-text" id="state-text">Ready</span></div>
      </div>
      <div class="controls" aria-label="Recording controls">
        <button class="control" id="start-btn" title="Start recording" aria-label="Start recording">▶</button>
        <button class="control hidden" id="pause-btn" title="Pause recording" aria-label="Pause recording">Ⅱ</button>
        <button class="control hidden" id="resume-btn" title="Resume recording" aria-label="Resume recording">▶</button>
        <button class="control hidden" id="stop-btn" title="Stop and transcribe" aria-label="Stop and transcribe">■</button>
        <button class="control cancel" id="cancel-btn" title="Cancel recording" aria-label="Cancel recording">×</button>
      </div>
    </section>
    <script>
      const mic = document.getElementById('mic');
      const stateText = document.getElementById('state-text');
      const startBtn = document.getElementById('start-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const resumeBtn = document.getElementById('resume-btn');
      const stopBtn = document.getElementById('stop-btn');
      const cancelBtn = document.getElementById('cancel-btn');
      const buttons = [startBtn, pauseBtn, resumeBtn, stopBtn, cancelBtn];

      function update(state) {
        mic.className = 'mic';
        if (state === 'recording') mic.classList.add('recording');
        if (state === 'paused') mic.classList.add('paused');
        if (state === 'transcribing') mic.classList.add('transcribing');
        stateText.textContent = state === 'recording' ? 'Listening…' : state[0].toUpperCase() + state.slice(1);
        buttons.forEach((button) => { button.disabled = state === 'transcribing'; });
        startBtn.classList.toggle('hidden', state !== 'ready');
        pauseBtn.classList.toggle('hidden', state !== 'recording');
        resumeBtn.classList.toggle('hidden', state !== 'paused');
        stopBtn.classList.toggle('hidden', state !== 'recording' && state !== 'paused');
        cancelBtn.classList.toggle('hidden', state === 'ready');
      }

      [
        [startBtn, 'start'], [pauseBtn, 'pause'], [resumeBtn, 'resume'],
        [stopBtn, 'stop'], [cancelBtn, 'cancel'],
      ].forEach(([button, action]) => button.addEventListener('click', async () => {
        try { await window.api.overlayAction(action); }
        catch (error) { stateText.textContent = error instanceof Error ? error.message : 'Action unavailable'; }
      }));
      window.api.onRecordingState(update);
      window.api.onSettingsUpdated((settings) => {
        document.documentElement.style.setProperty('--accent', settings.accentColor);
        document.documentElement.style.setProperty('--accent-glow', `${settings.accentColor}66`);
      });
      window.api.getSettings().then((settings) => {
        document.documentElement.style.setProperty('--accent', settings.accentColor);
        document.documentElement.style.setProperty('--accent-glow', `${settings.accentColor}66`);
      }).catch(() => {});
      window.api.getRecordingState().then(update).catch(() => update('ready'));
    </script>
  </body>
</html>
